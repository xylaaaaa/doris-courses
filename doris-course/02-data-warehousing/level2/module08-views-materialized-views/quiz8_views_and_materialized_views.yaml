title: 'Module 8: Views and Materialized Views'
description: Five multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Distinguish a logical view from a stored materialized result.
  prompt: Which statement best distinguishes a view from a materialized view?
  options:
  - id: a
    text: A. Both always store a copy of every source row.
  - id: b
    text: B. A view stores a query definition; a materialized view maintains a query result.
  - id: c
    text: C. A materialized view is merely a table with a different name.
  - id: d
    text: D. A view cannot contain a JOIN.
  answer: b
  explanation: A view stores a query definition. A materialized view also maintains a stored result that can avoid repeated computation.
- id: q2
  objective: Choose a refresh strategy based on freshness and cost requirements.
  prompt: A dashboard can tolerate data that is five minutes old in exchange for lower refresh cost. Which design is appropriate?
  options:
  - id: a
    text: A. Refresh on every query without considering cost.
  - id: b
    text: B. Disable refresh but claim the data is real-time.
  - id: c
    text: C. Define an explicit scheduled or manual refresh strategy.
  - id: d
    text: D. Replace the view with a client-side CSV.
  answer: c
  explanation: An explicit scheduled or manual refresh policy trades freshness for predictable work. The chosen policy must be documented.
- id: q3
  objective: Validate a materialized view using metadata and results.
  prompt: What should you check after creating a materialized view?
  options:
  - id: a
    text: A. Refresh status, row values, and aggregate totals.
  - id: b
    text: B. Only the CREATE statement text.
  - id: c
    text: C. Only client response time.
  - id: d
    text: D. Only whether the object name exists.
  answer: a
  explanation: Check refresh metadata and compare materialized results against the canonical query results.
- id: q4
  objective: Use EXPLAIN rather than guessing to verify query rewrite.
  prompt: What is appropriate evidence that a query uses a materialized view?
  options:
  - id: a
    text: A. The query returns at least one row.
  - id: b
    text: B. The source table still exists.
  - id: c
    text: C. The view has a descriptive name.
  - id: d
    text: D. The plan shows the materialized view or its scan, and results agree.
  answer: d
  explanation: Plan evidence from EXPLAIN plus a result comparison is more reliable than inferring rewrite from an object name.
- id: q5
  objective: Keep a published view contract stable while changing its implementation.
  prompt: Why publish a view as a serving contract?
  options:
  - id: a
    text: A. It forces every consumer to understand physical tablets.
  - id: b
    text: B. It separates the consumer contract from implementation details.
  - id: c
    text: C. It prevents all schema evolution.
  - id: d
    text: D. It guarantees every query will be rewritten.
  answer: b
  explanation: Consumers rely on stable columns and semantics while maintainers can change the underlying implementation.
