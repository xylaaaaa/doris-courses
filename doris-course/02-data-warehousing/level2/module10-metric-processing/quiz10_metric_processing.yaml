title: 'Module 10: Metric Processing and Serving'
description: Five multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Define a metric with its numerator, denominator, grain, and filters.
  prompt: What must a metric contract specify?
  options:
  - id: a
    text: A. Only its display title.
  - id: b
    text: B. Only the dashboard refresh interval.
  - id: c
    text: C. Its grain, inputs, filters, and calculation.
  - id: d
    text: D. Only the SQL engine version.
  answer: c
  explanation: A metric is reproducible only when its grain, inputs, filters, and calculation are explicit.
- id: q2
  objective: Distinguish detailed facts from an aggregate serving table.
  prompt: Why create an aggregate serving table?
  options:
  - id: a
    text: A. To delete detailed facts.
  - id: b
    text: B. To serve repeated metrics at a declared grain.
  - id: c
    text: C. To hide every source-data error.
  - id: d
    text: D. To eliminate JOINs from every query.
  answer: b
  explanation: It provides a stable serving grain while retaining detailed facts for drill-down and reconciliation.
- id: q3
  objective: Validate metrics using an independent query against detailed data.
  prompt: How should you accept an aggregate table?
  options:
  - id: a
    text: A. Reconcile its results with an independent detailed-data query.
  - id: b
    text: B. Check only that INSERT succeeded.
  - id: c
    text: C. Check only the physical bucket count.
  - id: d
    text: D. Trust a dashboard screenshot.
  answer: a
  explanation: Before publishing, compare row counts and amounts with an independent aggregation of the detailed facts.
- id: q4
  objective: Use window functions without accidentally changing row grain.
  prompt: What does a window function typically do?
  options:
  - id: a
    text: A. It always removes duplicate rows.
  - id: b
    text: B. It always creates a new table.
  - id: c
    text: C. It always changes daily metrics to monthly metrics.
  - id: d
    text: D. It adds a calculation while retaining the input row grain.
  answer: d
  explanation: A window calculation annotates existing rows; it does not itself collapse them into groups.
- id: q5
  objective: Publish a narrowly scoped serving query for dashboard consumers.
  prompt: Why provide a narrowly scoped serving query?
  options:
  - id: a
    text: A. To expose every physical column.
  - id: b
    text: B. To prevent validation.
  - id: c
    text: C. To limit consumer coupling to reviewed metric fields.
  - id: d
    text: D. To guarantee zero refresh cost.
  answer: c
  explanation: A narrow contract reduces coupling and makes dashboard columns and semantics reviewable.
