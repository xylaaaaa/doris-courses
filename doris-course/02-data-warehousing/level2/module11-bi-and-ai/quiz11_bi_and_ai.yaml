title: 'Module 11: BI and AI Applications'
description: Five multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Design a consumer-facing semantic view with stable names.
  prompt: What does a semantic view provide to BI consumers?
  options:
  - id: a
    text: A. A stable, reviewed contract for dimensions and measures.
  - id: b
    text: B. A replacement for all source data.
  - id: c
    text: C. Correct dashboards without testing.
  - id: d
    text: D. A physical copy for every consumer.
  answer: a
  explanation: It gives consumers reviewed names and meanings so dashboards need not reimplement business logic independently.
- id: q2
  objective: Distinguish dashboard dimensions from metric measures.
  prompt: In a daily order dashboard, which field is a measure?
  options:
  - id: a
    text: A. order_date
  - id: b
    text: B. region label
  - id: c
    text: C. gross_amount
  - id: d
    text: D. dashboard title
  answer: c
  explanation: Order count and gross amount are measures; the date is a dimension.
- id: q3
  objective: Prepare a feature projection without overstating model quality.
  prompt: What does a feature projection provide?
  options:
  - id: a
    text: A. Guaranteed predictions.
  - id: b
    text: B. Reviewed input columns for a downstream model or service.
  - id: c
    text: C. Automatic access to private data.
  - id: d
    text: D. A replacement for monitoring.
  answer: b
  explanation: It prepares named, typed inputs but does not prove that a downstream model is accurate.
- id: q4
  objective: Validate nulls, freshness, and row counts before serving consumers.
  prompt: Which checks should precede publishing a consumer view?
  options:
  - id: a
    text: A. Only chart colors.
  - id: b
    text: B. Only SQL text length.
  - id: c
    text: C. Only the model framework version.
  - id: d
    text: D. Nulls, freshness or date coverage, row counts, and totals.
  answer: d
  explanation: Check nulls, date coverage, row counts, and metric totals before publication.
- id: q5
  objective: Document the boundary between Doris SQL and downstream BI or AI tools.
  prompt: What should an integration boundary document?
  options:
  - id: a
    text: A. Data contract, freshness, access rights, and downstream responsibilities.
  - id: b
    text: B. Only the JDBC driver name.
  - id: c
    text: C. Only the visualization theme.
  - id: d
    text: D. That downstream accuracy is automatically guaranteed.
  answer: a
  explanation: State what Doris guarantees and what BI or AI consumers remain responsible for.
