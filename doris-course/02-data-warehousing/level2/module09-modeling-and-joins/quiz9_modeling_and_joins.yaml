title: 'Module 9: Warehouse Modeling and JOINs'
description: Five multiple-choice questions. No database connection required.
questions:
- id: q1
  objective: Describe the grain of fact and dimension tables.
  prompt: What should you document before choosing a JOIN key?
  options:
  - id: a
    text: A. What one row represents in each input.
  - id: b
    text: B. Only the expected query latency.
  - id: c
    text: C. The number of dashboard colors.
  - id: d
    text: D. The FE host name.
  answer: a
  explanation: Grain states what one row means. Without it, duplicate matches and incorrect totals are easy to miss.
- id: q2
  objective: Choose a table model and key that match update semantics.
  prompt: A customer dimension holds one current row per customer. Which design fits?
  options:
  - id: a
    text: A. A Duplicate Key on the event timestamp.
  - id: b
    text: B. An Aggregate Key on the customer name.
  - id: c
    text: C. A Unique Key on customer_id.
  - id: d
    text: D. Random distribution with no key.
  answer: c
  explanation: A Unique Key on customer_id represents current state and supports updates to that row.
- id: q3
  objective: Validate one-to-one and one-to-many JOIN cardinality.
  prompt: How can duplicate dimension keys affect an order total?
  options:
  - id: a
    text: A. They always delete fact rows.
  - id: b
    text: B. They only change column names.
  - id: c
    text: C. They cannot affect aggregates.
  - id: d
    text: D. They can duplicate fact rows and inflate the total.
  answer: d
  explanation: A one-to-many match can duplicate fact rows and inflate an aggregate.
- id: q4
  objective: Find missing dimensions with a LEFT JOIN anti-join check.
  prompt: Which query pattern finds facts with no matching dimension?
  options:
  - id: a
    text: A. INNER JOIN followed by WHERE right_key IS NOT NULL.
  - id: b
    text: B. LEFT JOIN followed by WHERE right_key IS NULL.
  - id: c
    text: C. GROUP BY without a JOIN.
  - id: d
    text: D. ORDER BY the dimension name.
  answer: b
  explanation: After a LEFT JOIN, a null right-side key identifies an unmatched fact row.
- id: q5
  objective: Read JOIN distribution evidence from EXPLAIN.
  prompt: Why inspect EXPLAIN for a JOIN?
  options:
  - id: a
    text: A. To see the JOIN type, condition, and distribution strategy.
  - id: b
    text: B. To prove business keys are unique.
  - id: c
    text: C. To replace result validation.
  - id: d
    text: D. To avoid defining grain.
  answer: a
  explanation: The plan shows the JOIN condition and possible data movement; elapsed time on a tiny local dataset is not sufficient evidence.
