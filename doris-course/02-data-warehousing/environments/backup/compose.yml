name: doris-warehousing-backup
services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address :9001
    networks:
      default:
        aliases: [course-backup-minio]
    mem_limit: 512m
    cpus: 1
    environment:
      MINIO_ROOT_USER: course_backup
      MINIO_ROOT_PASSWORD: course_backup_local_only
    ports:
      - '127.0.0.1:51910:9000'
    volumes:
      - backup-objects:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  backup-objects:
