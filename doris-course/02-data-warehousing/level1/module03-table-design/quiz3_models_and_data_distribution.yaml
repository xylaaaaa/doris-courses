title: "Module 3: Model semantics, partitioning, and bucketing"
description: "Five single-choice questions; no database connection required. View explanations after submitting."
questions:
- id: q1
  objective: "Predict the results of the same input in the Duplicate, Unique, and Aggregate models."
  prompt: "With the same key design and no Sequence column, write (order_id, amount) rows (17,90), (17,85), and (23,12) in order, waiting for each write to succeed and become visible before the next. The Aggregate amount column declares SUM. Which result is correct?"
  options:
  - id: a
    text: "A. All three models retain the latest amount of 85 for order 17"
  - id: b
    text: "B. Duplicate retains three rows; order 17 is 85 in Unique and 175 in Aggregate"
  - id: c
    text: "C. Duplicate rejects duplicate keys; order 17 is 85 in Unique and 175 in Aggregate"
  - id: d
    text: "D. Duplicate retains three rows; order 17 keeps the larger amount of 90 in Unique and 175 in Aggregate"
  answer: b
  explanation: "A: Different models have different write semantics; they cannot all be interpreted as replacing data with the latest snapshot. B: Correct. Duplicate retains detail records, Unique retains the later value under the sequential-write conditions, and Aggregate sums 90 and 85 for order 17. C: Duplicate Key uses keys for sorting, not for rejecting duplicate business keys. D: Unique does not select the largest amount; the amount is not a version, and 175 is not the current order amount."
- id: q2
  objective: "Choose logical keys and table models for detail records, current state, or aggregate metrics."
  prompt: "A merchant needs the latest status per order for a dashboard and every distinct status-change event for audit. A network retry can resend the same event_id. Which keys preserve both grains?"
  options:
  - id: a
    text: "A. Use order_id as the unique key for both the current-state table and event history"
  - id: b
    text: "B. Use event_id as the unique key for the current-state table and order_id for event history"
  - id: c
    text: "C. Use order_id as the unique key for the current-state table and a stable event_id for event history"
  - id: d
    text: "D. Use order_id as the unique key for the current-state table and generate a new event_id for every redelivery in event history"
  answer: c
  explanation: "A: Multiple events for the same order overwrite each other, preventing complete history retention. B: The current-state table retains multiple event rows, while history loses earlier events for the same order. C: Correct. Current state has one row per order, and history has one row per distinct event; redeliveries of the same event still use the original ID. D: A new ID disguises a duplicate delivery as a new business event, breaking event deduplication."
- id: q3
  objective: "Distinguish the roles of partitions, buckets, sort keys, and business unique keys."
  prompt: "A date-partitioned Duplicate Key table is hashed by order_id. A retry appends the same order twice, and a teammate proposes adding buckets to remove the duplicate. Which diagnosis is right?"
  options:
  - id: a
    text: "A. Date partitions choose ranges and hash buckets distribute rows; neither removes a repeated business event, so deduplication needs its own key or rule"
  - id: b
    text: "B. The date partition already makes order_id globally unique, so the second row must only be a display artifact"
  - id: c
    text: "C. More hash buckets will keep only one copy of each order_id when the retry is loaded"
  - id: d
    text: "D. A Duplicate Key sort key keeps only the latest retry after Compaction finishes"
  answer: a
  explanation: "A: Correct. Partition and bucket choices organize data, and a Duplicate Key sort key orders it; none is a business-event deduplication rule. B: A date partition is not a global uniqueness constraint. C: Hashing the same order_id places matching rows in a shard but does not remove either row. D: Compaction preserves Duplicate Key rows; it does not turn the model into Unique Key."
- id: q4
  objective: "Use EXPLAIN to compare scan ranges with date filters and bucket-key filters."
  prompt: "A reviewer compares a date-filter query with the same query plus order_id equality on a date-partitioned, HASH(order_id) table. Both return one row. What plan evidence distinguishes the filters' scan effects?"
  options:
  - id: a
    text: "A. Look only at the final number of returned rows and treat it as the scan volume"
  - id: b
    text: "B. Look only at the total bucket count specified at table creation and assume every query scans all Tablets"
  - id: c
    text: "C. Compare only whether the plan text is identical word for word, without analyzing the ranges corresponding to the filters"
  - id: d
    text: "D. Compare the selected partitions and Tablet ranges, distinguishing date pruning from bucket pruning"
  answer: d
  explanation: "A: Returned rows are not scanned rows, nor do they indicate how many shards were read. B: Applicable filters can prune partitions and Tablets; the total bucket count does not equal the scan range for every query. C: Plan representations may change across versions; understand the selected ranges rather than comparing word for word. D: Correct. Date conditions and order_id equality conditions let you observe the two types of pruning separately."
- id: q5
  objective: "Verify results using both detail records and amounts, without equating plan pruning with performance gains."
  prompt: "A candidate current-order view returns four order IDs and a total amount of 200, matching an independent extract. A downstream report filters by status, but one order's status differs from the extract. EXPLAIN scans fewer Tablets than before. What should release review conclude?"
  options:
  - id: a
    text: "A. Publish: matching order count and amount prove that every status is correct"
  - id: b
    text: "B. Publish: fewer planned Tablets prove both business correctness and lower actual latency"
  - id: c
    text: "C. Reconcile the status mismatch row by row, then measure actual runtime under the same workload"
  - id: d
    text: "D. Ignore the status mismatch because a matching total is sufficient for a status-filtered report"
  answer: c
  explanation: "A: Equal counts and totals can hide a wrong field value. B: EXPLAIN describes planned pruning, not actual latency or business correctness. C: Correct. Status affects the report population, so reconcile the detail first and test performance separately with runtime evidence. D: A matching total today does not make an incorrect status safe for a status-filtered report."
