[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doris-data-warehousing-course"
version = "0.1.0"
description = "Order-domain labs for Data Warehousing with Apache Doris"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pandas==2.2.3",
  "PyMySQL==1.1.1",
  "requests==2.32.5",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.29.5",
  "ipywidgets>=8.1,<9",
  "PyYAML>=6.0,<7",
  "jupyterlab==4.4.10",
  "boto3==1.40.0",
]

[project.optional-dependencies]
extensions = ["pyarrow==19.0.1"]

[tool.setuptools.packages.find]
include = ["dw_course*"]
